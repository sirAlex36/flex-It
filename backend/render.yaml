services:
  - type: web
    name: flexit-backend
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python -c "
    import os
    import sys

# Fix database URL
if os.environ.get('DATABASE_URL'):
    os.environ['DATABASE_URL'] = os.environ['DATABASE_URL'].replace('postgres://', 'postgresql://', 1)

from backend.app import create_app, db
import backend.app.models

app = create_app()
with app.app_context():
    db.create_all()
    print('✓ Database tables created successfully')
    print('Tables:', db.engine.table_names())
"
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flexit-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: QR_SECRET
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://flex-it-six.vercel.app

databases:
  - name: flexit-db
    databaseName: flexitdb
    user: flexitdb_user